[package]
name = "offline-intelligence"
version = "0.1.1"
description = "OFFLINE INTELLIGENCE"
license = "Apache-2.0"
repository = ""
readme = "README.md"
edition = "2021"

[lib]
name = "offline_intelligence"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "offline-intelligence"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
prometheus = "0.13"
lazy_static = "1.4"
tower = { version = "0.4", features = ["limit", "buffer", "util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout", "limit"] }
sysinfo = "0.30"
nvml-wrapper = "0.10"
num_cpus = "1.16"
futures = "0.3"
futures-util = "0.3"
gguf = "0.1"
zerofrom = "0.1"
include_dir = "0.7"
flate2 = "1.0"
tar = "0.4"
zip = "1.1"
clap = { version = "4.4", features = ["derive"] }
dashmap = "5.5"
rusqlite = { version = "0.32", features = ["bundled", "functions", "modern_sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
blake3 = "1.5"
bincode = "1.3"
rand = "0.8"
moka = { version = "0.12", features = ["future", "sync"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
hora = "0.1"
validator = { version = "0.16", features = ["derive"] }
rayon = "1.8"
bytes = "1.5"
which = "1.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
mockito = "1.2"
proptest = "1.4"